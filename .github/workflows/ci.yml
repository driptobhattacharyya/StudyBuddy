name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt

      # The code-runner tests execute Java and JavaScript submissions.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      MONGODB_URI: mongomock://
      DEMO_MODE: "true"
      SEED_DEMO_ON_STARTUP: "true"
      AI_PROVIDER: mock
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      CORS_ORIGINS: http://localhost:4173
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt

      # The code runner executes Java and JavaScript submissions.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements-dev.txt

      - name: Start backend (mongomock, demo mode, mock AI)
        working-directory: Backend
        run: |
          nohup uvicorn main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build and preview frontend
        working-directory: Frontend
        run: |
          npm run build
          nohup npm run preview -- --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4173 > /dev/null && break; sleep 1; done

      - name: Install Playwright browser
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: Frontend
        run: npx playwright test --trace off

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            Frontend/playwright-report
            Frontend/test-results
            backend.log
            preview.log
