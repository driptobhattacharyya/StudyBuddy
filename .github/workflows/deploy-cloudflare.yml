name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  HAS_CF_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    # Secrets cannot be used in a job-level `if`, so steps are gated instead: without the
    # secrets every step is skipped and the job still succeeds.
    steps:
      - name: Check secrets
        id: gate
        run: echo "ok=$HAS_CF_SECRET" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            deploy/cloudflare/package-lock.json

      - name: Build frontend
        if: steps.gate.outputs.ok == 'true'
        working-directory: Frontend
        env:
          VITE_API_URL: https://studybuddy.driptobhattacharyya.com/api
        run: |
          npm ci
          npm run build

      - name: Deploy Worker
        if: steps.gate.outputs.ok == 'true'
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy
